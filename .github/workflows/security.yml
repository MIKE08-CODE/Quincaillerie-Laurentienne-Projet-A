# Pipeline « security » du cahier des charges (§6.2) : CodeQL (Python, GitHub Actions) et Gitleaks.
# Déclenché sur chaque PR vers main, chaque push sur main et une fois par semaine.
# JavaScript/TypeScript et C# seront ajoutés à la matrice CodeQL quand web/, mobile/ et desktop/ existeront.
#
# Gitleaks complète le secret scanning et la push protection de GitHub (motifs des fournisseurs) :
# il ajoute les règles génériques et l'entropie. Il s'exécute APRÈS le push : il détecte, il ne prévient pas.

name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # chaque lundi à 06:23 UTC
  workflow_dispatch:

permissions: {} # aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # lecture du code
      security-events: write # envoi des résultats dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # aucune compilation : Python, workflows, JS/TS et C# (extraction sans build)
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Gitleaks (historique Git)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # Empreinte officielle de gitleaks_8.30.1_linux_x64.tar.gz (checksums.txt et digest de la release).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : nécessaire pour la plage de la PR et l'analyse de main
          persist-credentials: false

      - name: Installer Gitleaks (version et empreinte épinglées)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Analyser les commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Les deux extrémités doivent exister dans le clone, sinon la plage serait fausse.
            for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
              if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
                echo "::error::Commit ${sha} absent du clone : analyse impossible"
                exit 1
              fi
            done
            log_opts="${BASE_SHA}..${HEAD_SHA}" # uniquement les commits apportés par la PR
          else
            log_opts="--all" # push sur main, planification, lancement manuel : tout l'historique
          fi
          count="$(git rev-list --count ${log_opts})"
          echo "Plage analysée : ${log_opts} (${count} commit(s))"
          if [ "${count}" -eq 0 ]; then
            echo "::error::Aucun commit à analyser : plage incorrecte"
            exit 1
          fi
          status=0
          "${RUNNER_TEMP}/gitleaks" git . \
            --no-banner --redact --verbose \
            --log-opts="${log_opts}" \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks-report.json" || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "::error::Gitleaks a signalé un secret potentiel ou n'a pas pu s'exécuter (code ${status}). Voir le journal et l'artéfact gitleaks-report."
          fi
          exit "${status}"

      - name: Publier le rapport Gitleaks (valeurs masquées)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  result:
    # Contrôle unique destiné à devenir obligatoire dans le ruleset protect-main.
    name: security
    needs: [codeql, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Synthèse des jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys

          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in results.items():
              print(f"{job}: {result}")
          # Aucun job n'est sauté volontairement : tout ce qui n'est pas « success » est un échec.
          sys.exit(0 if results and all(r == "success" for r in results.values()) else 1)
