# Intégration continue de l'application web React 18 + Vite (cahier des charges §6.2, exigence DevOps 2).
#
# Étapes : installation reproductible (npm ci) → ESLint → vérification des types → tests Vitest →
# build de production → audit des dépendances.
#
# Même principe que api-ci : le workflow se déclenche sur toutes les PR, le job `changes` saute le
# travail si /web n'est pas modifié, et le contrôle final « web-ci » est toujours rapporté.

name: web-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - name: Fichiers modifiés par la PR
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/web-ci.yml'

  build:
    name: Lint, types, tests et build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installation reproductible (package-lock.json)
        run: npm ci --no-fund

      - name: ESLint
        run: npm run lint

      - name: Vérification des types (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Audit des dépendances
        run: npm audit --audit-level=moderate

  result:
    # Contrôle unique à exiger dans le ruleset de `main` si l'équipe le décide.
    name: web-ci
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthèse des jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          import sys

          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in results.items():
              print(f"{job}: {result}")
          ok = results.get("changes") == "success" and results.get("build") in ("success", "skipped")
          sys.exit(0 if ok else 1)
