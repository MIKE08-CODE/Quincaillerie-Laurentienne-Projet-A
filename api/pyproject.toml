# Configuration des outils de l'API (les dépendances sont dans requirements*.txt).

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F : erreurs de base · I : ordre des imports · B : pièges courants · S : sécurité (comme Bandit)
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # Depends(...) dans les paramètres par défaut est le style normal de FastAPI

[tool.ruff.lint.isort]
# Le dossier api/alembic/ (migrations) n'est pas le paquet `alembic` : c'est une bibliothèque externe.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert et faux mots de passe autorisés dans les tests
"app/core/security_log.py" = ["S105"]  # noms d'événements (« password_reset_… »), pas des secrets
