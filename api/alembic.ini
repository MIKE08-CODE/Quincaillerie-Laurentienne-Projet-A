# Configuration d'Alembic (migrations de la base de données).
# L'URL de la base n'est PAS écrite ici : alembic/env.py la lit depuis le `.env` (ENF-02).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Séparateur explicite des chemins (Alembic ≥ 1.16) : celui du système d'exploitation.
path_separator = os
# Nom des fichiers : 20261120_1430_<révision>_<message>.py (ordre chronologique lisible)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
